# Meteo Faenza – nginx: file statici del frontend + reverse proxy verso l'API Python.
# Copiare in /etc/nginx/sites-available/meteo, collegare in sites-enabled, adattare
# server_name e root, poi: nginx -t && systemctl reload nginx.
# HTTPS: certbot --nginx -d meteo.example.it (aggiunge listen 443 e i certificati;
# il service worker funziona solo in HTTPS).

server {
    listen 80;
    server_name meteo.example.it;

    root /opt/meteo;          # cartella del repository (index.html, js/, css/, icons/…)
    index index.html;

    # API → server Python (in ascolto solo in locale, vedi deploy/meteo-api.service).
    # ^~: nessun'altra regola (es. le estensioni sotto) si applica a /api/.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Codice del server, database, test e file nascosti non sono pubblici.
    location ~ ^/(server|data|tests|deploy)(/|$) { return 404; }
    location ~ /\.            { return 404; }
    location ~ \.(py|md|db)$  { return 404; }

    # Pagine, script, stile e service worker: sempre rivalidati, così una nuova versione
    # arriva subito (l'uso offline lo gestisce il service worker).
    location ~ \.(html|js|css|webmanifest)$ { add_header Cache-Control "no-cache"; }
    location ~ \.(png|svg)$                 { expires 7d; }

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;
}

# Variante in una sottocartella (es. https://example.it/meteo/): il frontend usa percorsi
# relativi (api/forecast), quindi basta dentro il server esistente:
#
#   location /meteo/ { alias /opt/meteo/; index index.html; }
#   location ^~ /meteo/api/ { proxy_pass http://127.0.0.1:8085/api/; }
#   location ~ ^/meteo/(server|data|tests|deploy)(/|$) { return 404; }
